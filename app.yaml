command: ["bash", "-c", "cd backend && pip install -r requirements.txt && (uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &) && cd ../frontend && npm install && npm run build && python3 -m http.server 3000 --directory dist"]

env:
  - name: PYTHONUNBUFFERED
    value: "1"
  - name: PORT
    value: "3000"
